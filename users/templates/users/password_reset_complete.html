{% extends "daily/base.html" %}
{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 120px);">
    <div class="card shadow-sm border-0" style="max-width: 460px; width: 100%;">
        <div class="card-body p-4 text-center">
            <h4 class="card-title mb-3">Пароль успешно изменён</h4>
            <p class="text-muted mb-4">
                Новый пароль сохранён. Теперь вы можете войти в аккаунт с ним.
            </p>
            <a href="{% url 'users:login' %}" class="btn btn-primary w-100">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
