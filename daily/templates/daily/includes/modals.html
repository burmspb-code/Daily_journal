<!-- Модальное окно редактирования задачи (Железно темный матовый каркас) -->
<div class="modal fade edit-task-modal-backdrop" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <!-- КРИТИЧЕСКИ ВАЖНО: Стили прописаны жестко на корневом уровне, белый фон больше не появится -->
        <div class="modal-content text-white shadow-lg edit-task-modal-content">

            <form id="edit-task-form" onsubmit="saveTaskChanges(event)">
                {% csrf_token %}

                <div class="modal-header border-bottom border-light border-opacity-10 px-4 py-3">
                    <h5 class="modal-title fw-bold text-white fs-5" id="editTaskModalLabel">
                        Редактирование задачи <span id="edit-task-number-title" class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 ms-1 px-2.5 py-1 fs-6"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white opacity-50" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>

                <!-- Контейнер с идеально отцентрованным золотым спиннером на ТЕМНОМ фоне -->
                <div class="modal-body px-4 py-5 d-flex flex-column align-items-center justify-content-center" style="min-height: 250px;">
                    <div class="spinner-border text-warning mb-3" role="status" style="width: 2.5rem; height: 2.5rem; border-width: 0.23em;">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                    <div class="text-white-50 opacity-75 small fw-bold tracking-wider" style="font-size: 0.72rem; letter-spacing: 0.12em;">
                        ЗАГРУЗКА ДАННЫХ...
                    </div>
                </div>

                <div class="modal-footer border-top border-light border-opacity-10 px-4 py-3">
                    <button type="button" class="btn btn-sm btn-link text-white-50 text-decoration-none fw-semibold" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-sm btn-warning fw-bold text-dark px-4 shadow-sm btn-save-task">Сохранить изменения</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения удаления -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="deleteModalLabel">Подтвердите действие</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body" id="delete-modal-body">
                Вы уверены, что хотите удалить выбранные задачи (<span id="delete-count-span">1</span> шт.)?
            </div>

            <div class="modal-footer border-secondary justify-content-end gap-2">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete-action">ОК</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно ошибки лимита задач -->
<div class="modal fade" id="limitErrorModal" tabindex="-1" aria-labelledby="limitErrorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="limitErrorModalLabel">Превышен лимит</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body" id="limit-error-body">
                Превышен лимит задач для текущей закладки.
            </div>

            <div class="modal-footer border-secondary justify-content-end gap-2">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>
