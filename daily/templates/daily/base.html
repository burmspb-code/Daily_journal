<!DOCTYPE html>
<html lang="ru" class="h-100">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Journal{% endblock %}</title>
    
    <link href="{% static 'daily/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'daily/css/bootstrap-icons.min.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<!-- ИСПРАВЛЕНО: vh-100 фиксирует тело на высоту экрана, overflow-hidden убирает внешний скролл всей страницы -->
<body class="vh-100 d-flex flex-column overflow-hidden bg-light">

    <!-- Компонент навигационной панели (Фиксированная высота, никогда не сожмется) -->
    {% include 'daily/includes/navbar.html' %}

    <!-- Основной контент страницы -->
    <!-- ИСПРАВЛЕНО: flex-grow-1 забирает ВСЁ свободное пространство между навбаром и футером, my-3 делает аккуратные отступы -->
    <main class="flex-grow-1 overflow-hidden my-3">
        <!-- h-100 заставляет контейнер растянуться на всю доступную высоту main -->
        <div class="container h-100 d-flex flex-column">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Подвал сайта (Footer) -->
    <!-- ИСПРАВЛЕНО: flex-shrink-0 гарантирует, что футер всегда будет виден снизу и не сожмется -->
    <footer class="footer py-3 text-center text-white-50 flex-shrink-0" style="background-color: #1e293b !important;">
        <div class="container">
            <span class="small">© 2026 Daily Journal — Локальная сборка</span>
        </div>
    </footer>

    <script src="{% static 'daily/js/bootstrap.bundle.min.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
