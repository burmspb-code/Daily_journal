services:
  # =========================================================================
  # 1. СЛУЖБА REDIS (Брокер сообщений для Celery)
  # =========================================================================
  # Разворачивается локально на вашем компьютере.
  # Нужен для того, чтобы Django мог складывать туда фоновые задачи, а Celery — забирать.
  redis:
    # Используем официальный легковесный образ Redis на базе Alpine Linux
    image: redis:7-alpine
    # Пробрасываем порт Redis наружу. В коде к нему будем подключаться локально.
    ports:
      - "6379:6379"
    # Логирование сервиса
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Один файл лога не превысит 10 Мегабайт
        max-file: "3"   # Docker будет хранить максимум 3 старых файла (итого 30 МБ)

  # =========================================================================
  # 2. СЛУЖБА DJANGO (Веб-приложение)
  # =========================================================================
  web:
    # Собираем образ на основе Dockerfile, который находится в текущей папке (.)
    build: .
    # Команда запуска стандартного сервера разработки Django.
    # Флаг 0.0.0.0:8000 обязателен, чтобы сайт открывался на вашем основном ПК.
    command: python manage.py runserver 0.0.0.0:8000
    # Маппинг портов: связываем порт 8000 вашего компьютера с портом 8000 контейнера.
    # Ваш сайт будет доступен в браузере по адресу http://localhost:8000
    ports:
      - "8000:8000"
    # Логирование сервиса.
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Один файл лога не превысит 10 Мегабайт
        max-file: "3"   # Docker будет хранить максимум 3 старых файла (итого 30 МБ)
    # Монтирование папки (Volumes): связывает файлы на вашем ПК с файлами в контейнере.
    # Благодаря этому код обновляется «на лету» без пересборки образа.
    volumes:
      - .:/app
    # ПОДКЛЮЧЕНИЕ .ENV ФАЙЛА: Docker сам прочитает ваш файл .env и передаст
    # все переменные (SECRET_KEY, DB_NAME, DB_USER и т.д.) прямо в Django.
    env_file:
      - .env
    # Дополнительные переменные окружения, специфичные для Docker-сети
    environment:
      # Redis работает в соседнем контейнере, поэтому подключаемся к нему по имени службы "redis"
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=host.docker.internal
    # Настройка DNS: связывает адрес host.docker.internal со шлюзом вашего ПК.
    # Это позволяет Django выйти из контейнера и увидеть ваш SSH-туннель на порту 5433.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Указываем Docker не запускать сайт, пока не поднимется локальный контейнер Redis
    depends_on:
      - redis

  # =========================================================================
  # 3. СЛУЖБА CELERY WORKER (Обработчик фоновых задач)
  # =========================================================================
  # Этот контейнер слушает Redis, берет оттуда задачи и выполняет их в фоне.
  celery:
    # Использует тот же Python-образ, что и Django (сборка происходит один раз)
    build: .
    # Команда запуска воркера. Флаг "-A config" указывает Celery искать настройки в config/celery.py
    command: celery -A config worker --loglevel=info
    # Логирование сервиса.
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Один файл лога не превысит 10 Мегабайт
        max-file: "3"   # Docker будет хранить максимум 3 старых файла (итого 30 МБ)
    # Также монтируем код, чтобы Celery мгновенно подхватывал изменения в файлах tasks.py
    volumes:
      - .:/app
    # Передаем те же самые доступы к базе данных из .env файла
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  # =========================================================================
  # 4. СЛУЖБА CELERY BEAT (Планировщик задач по расписанию)
  # =========================================================================
  # Этот контейнер работает как будильник: он раз в минуту (или по расписанию)
  # отправляет команду в Redis: "Пора запустить периодическую задачу!".
  celery-beat:
    build: .
    # Команда запуска планировщика (beat) для проекта из папки config
    command: celery -A config beat --loglevel=info
    # Логирование сервиса.
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Один файл лога не превысит 10 Мегабайт
        max-file: "3"   # Docker будет хранить максимум 3 старых файла (итого 30 МБ)
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
