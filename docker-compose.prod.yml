services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3

  web:
    user: "appuser"
    image: ghcr.io/burmspb-code/daily_journal:latest
    restart: always
    # collectstatic при старте; ошибка статики не блокирует запуск web
    command: >
      sh -c "python manage.py collectstatic --noinput;
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 config.wsgi:application --workers 3"
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      # Используем IP шлюза Docker, который мы нашли через ip addr
      - DB_HOST=172.17.0.1
      # Доверенный origin для CSRF при работе через HTTPS
      - "CSRF_TRUSTED_ORIGINS=https://78.17.46.52"
    depends_on:
      redis:
        condition: service_healthy

  celery:
    user: "appuser"
    image: ghcr.io/burmspb-code/daily_journal:latest
    restart: always
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=172.17.0.1
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    user: "appuser"
    image: ghcr.io/burmspb-code/daily_journal:latest
    restart: always
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=172.17.0.1
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      # Webroot для ACME-проверки Let's Encrypt (выпуск и продление сертификата)
      - ./certbot/www:/var/www/certbot
      # Сертификаты Let's Encrypt; nginx читает их при включении HTTPS
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    depends_on:
      - web

volumes:
  static_volume:
  media_volume: