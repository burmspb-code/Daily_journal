[project]
name = "daily-journal"
version = "0.1.0"
description = ""
authors = [
    {name = "Mikhail Burdukovsky",email = "burmspb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-phonenumber-field (>=8.4.0,<9.0.0)",
    "phonenumbers (>=9.0.34,<10.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pywebpush (>=2.3.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "djangorestframework (>=3.17.2,<4.0.0)",
    "django-filter (>=26.1,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)"
]
