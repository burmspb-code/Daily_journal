# HTTP: только ACME-проверка и редирект на HTTPS.
server {
    listen 80;
    server_name 78.17.46.52;

    # ACME-проверка Let's Encrypt. Каталог смонтирован из ./certbot/www.
    # Нужен для выпуска и автоматического продления сертификата.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # Фиксированный адрес, чтобы не было open redirect через заголовок Host.
    location / {
        return 301 https://78.17.46.52$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name 78.17.46.52;

    # Сертификат Let's Encrypt на IP-адрес.
    ssl_certificate     /etc/letsencrypt/live/78.17.46.52/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/78.17.46.52/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ограничение на максимальный размер загружаемого файла (например, аватарки или документы в /media/)
    # Без этой строчки Nginx не пропустит файлы крупнее 1 МБ и выдаст ошибку 413.
    client_max_body_size 20m;

    # Перенаправление всех запросов на Gunicorn
    location / {
        proxy_pass http://web:8000;

        # Передаем оригинальный заголовок Host, чтобы Django корректно проверял ALLOWED_HOSTS
        proxy_set_header Host $host;

        # Передаем реальный IP-адрес клиента
        proxy_set_header X-Real-IP $remote_addr;

        # Передаем всю цепочку IP-адресов, если клиент шел через прокси-серверы
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Передаем схему протокола (http или https). Нужно для работы SECURE_PROXY_SSL_HEADER в Django
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # Раздача статики силами Nginx (быстро и разгружает Django)
    location /static/ {
        alias /app/staticfiles/;
        # Оптимизация: заставляем браузеры кэшировать статику на 30 дней, чтобы не запрашивать её каждый раз
        expires 30d;
        access_log off;
    }

    # Раздача медиа-файлов (если есть загрузки)
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
        access_log off;
    }
}
