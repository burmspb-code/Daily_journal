server {
    listen 80;
    server_name localhost;

    # Ограничение на максимальный размер загружаемого файла (например, аватарки или документы в /media/)
    # Без этой строчки Nginx не пропустит файлы крупнее 1 МБ и выдаст ошибку 413.
    client_max_body_size 20m;

    # Перенаправление всех запросов на Gunicorn
    location / {
        proxy_pass http://web:8000;

        # Передаем оригинальный заголовок Host, чтобы Django корректно проверял ALLOWED_HOSTS
        proxy_set_header Host $host;

        # Передаем реальный IP-адрес клиента
        proxy_set_header X-Real-IP $remote_addr;

        # Передаем всю цепочку IP-адресов, если клиент шел через прокси-серверы
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Передаем схему протокола (http или https). Нужно для работы SECURE_PROXY_SSL_HEADER в Django
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # Раздача статики силами Nginx (быстро и разгружает Django)
    location /static/ {
        alias /app/staticfiles/;
        # Оптимизация: заставляем браузеры кэшировать статику на 30 дней, чтобы не запрашивать её каждый раз
        expires 30d;
        access_log off;
    }

    # Раздача медиа-файлов (если есть загрузки)
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
        access_log off;
    }
}
